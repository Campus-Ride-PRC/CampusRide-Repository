plugins {
    id 'java-library'
}

group = 'campus.ride'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Align Spring Framework versions with Spring Boot 3.5.x (Spring Framework 6.2.x)
    implementation platform('org.springframework:spring-framework-bom:6.2.12')

    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // Spring annotations and component model (@Service)
    implementation 'org.springframework:spring-context'

    // Spring transactions for @Transactional
    implementation 'org.springframework:spring-tx'

    // Spring Data JPA API for repository contracts
    implementation 'org.springframework.data:spring-data-jpa:3.4.2'

    // Jackson for JSON processing (needed for @JsonFormat and other annotations)
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.18.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'

    api project(':Domain')

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    
    implementation 'org.apache.logging.log4j:log4j-api:2.21.1'

    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.0.Final'
}

test {
    useJUnitPlatform()
}