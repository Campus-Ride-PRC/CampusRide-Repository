plugins {
    id 'java-library'
}

group = 'campus.ride'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.3.5')

    // Core Spring components
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-tx'

    // JPA and persistence API
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'jakarta.persistence:jakarta.persistence-api'

    // Jackson (managed by BOM, only add modules not automatically pulled)
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Caffeine cache, mail, security crypto
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Logging
    implementation 'org.apache.logging.log4j:log4j-api'

    // OpenAPI (declare here if Application exposes internal endpoints; optional)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    implementation 'org.springframework:spring-context-support:6.1.10'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    implementation 'org.springframework.security:spring-security-crypto:6.3.1'
    implementation("org.springframework.boot:spring-boot-starter-mail:3.5.7")

    api project(':Domain')

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}