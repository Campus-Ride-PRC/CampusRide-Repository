plugins {
    id 'java-library'
}

group = 'campus.ride'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Align Spring Framework versions with Spring Boot 3.3.x (Spring Framework 6.1.x)
    implementation platform('org.springframework:spring-framework-bom:6.1.14')

    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // Spring annotations and component model (@Service)
    implementation 'org.springframework:spring-context'

    // Spring transactions for @Transactional
    implementation 'org.springframework:spring-tx'

    // Spring Data JPA API for repository contracts
    implementation 'org.springframework.data:spring-data-jpa:3.3.4'

    // Domain model is part of Application's public API (referenced in contracts)
    api project(':Domain')

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}