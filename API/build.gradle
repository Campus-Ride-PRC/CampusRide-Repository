plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'campus.ride'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Dependency on the Application module for service interfaces/beans
    implementation project(':Application')
    implementation project(':Infrastructure')

    // Spring Web for REST controllers, JSON (Jackson), and embedded server
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Data JPA runtime support (Hibernate, entity manager, etc.)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Bean validation (Jakarta Validation API + Hibernate Validator)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Enable proxying for @Async
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Swagger/OpenAPI UI via springdoc
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // JDBC driver for PostgreSQL
    runtimeOnly 'org.postgresql:postgresql:42.7.4'

    // Testing with JUnit Jupiter and Spring Boot test utilities
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}

application {
    mainClass='campus.ride.ApiApplication'
}
