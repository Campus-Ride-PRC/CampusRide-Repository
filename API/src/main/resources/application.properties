spring.application.name=API

# Database Configuration
spring.datasource.url=jdbc:postgresql://db.dycguxeljfcqbyuctfkw.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=kpXTmWz2AKGR2L7a
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Entity scanning - scan the domain package for entities
spring.jpa.properties.hibernate.archive.autodetection=class

# Use orm.xml mapping file from Infrastructure module
spring.jpa.mapping-resources=META-INF/orm.xml

# Hibernate DDL auto (update, create, create-drop, validate, none)
spring.jpa.hibernate.ddl-auto=update
