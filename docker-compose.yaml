services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: campusride-backend
    network_mode: "host"
#    ports:
#      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusride-frontend
#    ports:
#      - "8100:8100"
    network_mode: "host"
    environment:
      - NODE_ENV=development
    depends_on:
      - app
    volumes:
      - ./frontend:/app