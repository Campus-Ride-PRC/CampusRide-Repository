<div class="ride-card" (click)="onCardClick()">

    <div class="avatar-container">
      <img [src]="userAvatar" [alt]="userName" class="avatar" />
    </div>

          </g>
          <defs>
            <clipPath id="clip0_248_288">
              <rect width="16" height="16" fill="white"/>
            </clipPath>
          </defs>
        </svg>
        <span class="rating-value">{{ rating }}</span>
      </div>
    </div>
  </div>

  <div class="location-section">
    <div class="location-info">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16.6667 8.33329C16.6667 12.4941 12.0508 16.8275 10.5008 18.1658C10.3564 18.2744 10.1807 18.3331 10 18.3331C9.81934 18.3331 9.64357 18.2744 9.49918 18.1658C7.94918 16.8275 3.33334 12.4941 3.33334 8.33329C3.33334 6.56518 4.03572 4.86949 5.28596 3.61925C6.53621 2.36901 8.2319 1.66663 10 1.66663C11.7681 1.66663 13.4638 2.36901 14.7141 3.61925C15.9643 4.86949 16.6667 6.56518 16.6667 8.33329Z" stroke="#CAC8C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 10.8334C11.3807 10.8334 12.5 9.71409 12.5 8.33337C12.5 6.95266 11.3807 5.83337 10 5.83337C8.61929 5.83337 7.5 6.95266 7.5 8.33337C7.5 9.71409 8.61929 10.8334 10 10.8334Z" stroke="#CAC8C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="location-details">
        <div class="location-label">From</div>
        <div class="location-value">{{ fromLocation }}</div>
      </div>
    </div>

    <div class="location-connector">
      <svg width="60" height="20" viewBox="0 0 60 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 10H55M55 10L47 4M55 10L47 16" stroke="#00C36C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/>
      </svg>
    </div>

    <div class="location-info">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16.6667 8.33329C16.6667 12.4941 12.0508 16.8275 10.5008 18.1658C10.3564 18.2744 10.1807 18.3331 10 18.3331C9.81934 18.3331 9.64357 18.2744 9.49918 18.1658C7.94918 16.8275 3.33334 12.4941 3.33334 8.33329C3.33334 6.56518 4.03572 4.86949 5.28596 3.61925C6.53621 2.36901 8.2319 1.66663 10 1.66663C11.7681 1.66663 13.4638 2.36901 14.7141 3.61925C15.9643 4.86949 16.6667 6.56518 16.6667 8.33329Z" stroke="#CAC8C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 10.8334C11.3807 10.8334 12.5 9.71409 12.5 8.33337C12.5 6.95266 11.3807 5.83337 10 5.83337C8.61929 5.83337 7.5 6.95266 7.5 8.33337C7.5 9.71409 8.61929 10.8334 10 10.8334Z" stroke="#CAC8C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="location-details">
        <div class="location-label">Destination</div>
        <div class="location-value">{{ toLocation }}</div>
      </div>
    </div>
  </div>

  <div class="departure-section">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g clip-path="url(#clip0_248_324)">
        <path d="M9.99999 18.3333C14.6024 18.3333 18.3333 14.6023 18.3333 9.99996C18.3333 5.39759 14.6024 1.66663 9.99999 1.66663C5.39762 1.66663 1.66666 5.39759 1.66666 9.99996C1.66666 14.6023 5.39762 18.3333 9.99999 18.3333Z" stroke="#CAC8C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 5V10L13.3333 11.6667" stroke="#CAC8C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <defs>
        <clipPath id="clip0_248_324">
          <rect width="20" height="20" fill="white"/>
        </clipPath>
      </defs>
    </svg>
    <div class="departure-details">
      <div class="departure-label">Departure</div>
      <div class="departure-value">{{ departureTime }}</div>
    </div>
  </div>

  <div class="footer-section">
    <div class="seats-info">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M13.3333 17.5V15.8333C13.3333 14.9493 12.9821 14.1014 12.357 13.4763C11.7319 12.8512 10.884 12.5 9.99999 12.5H4.99999C4.11593 12.5 3.26809 12.8512 2.64297 13.4763C2.01785 14.1014 1.66666 14.9493 1.66666 15.8333V17.5" stroke="#00C36C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13.3333 2.60669C14.0481 2.792 14.6812 3.20941 15.1331 3.79341C15.585 4.37741 15.8302 5.09493 15.8302 5.83336C15.8302 6.57178 15.585 7.28931 15.1331 7.8733C14.6812 8.4573 14.0481 8.87471 13.3333 9.06002" stroke="#00C36C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18.3333 17.4999V15.8333C18.3328 15.0947 18.087 14.3773 17.6345 13.7935C17.182 13.2098 16.5485 12.7929 15.8333 12.6083" stroke="#00C36C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M7.49999 9.16667C9.34094 9.16667 10.8333 7.67428 10.8333 5.83333C10.8333 3.99238 9.34094 2.5 7.49999 2.5C5.65904 2.5 4.16666 3.99238 4.16666 5.83333C4.16666 7.67428 5.65904 9.16667 7.49999 9.16667Z" stroke="#00C36C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="seats-available">{{ seatsAvailable }}</span>
      <span class="seats-text">of {{ totalSeats }} seats left</span>
    </div>
    <div class="price">{{ price }}</div>
  </div>
</div>
