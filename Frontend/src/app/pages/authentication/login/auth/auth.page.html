<ion-content class="bg-dark-bg text-white">

  <div class="flex flex-col justify-between min-h-full pb-20">
    
    <div class="flex-1 flex flex-col justify-center items-center">
      <div class="w-80 md:w-96 max-w-[480px] bg-neutral-800 rounded-2xl p-8 flex flex-col items-center shadow-lg">

        <div class="text-center mt-2 px-[24px]">
          <h2 class="font-sans text-[44px] font-[700] mb-2">CampusRide</h2>
        </div>

        <div class="text-center font-[16px] mt-[24px] px-[24px]">
          <p class="text-[20px] font-[600] text-gray-300 mb-4">Welcome back! Use your credentials to log in!</p>
        </div>

        <div class="mt-[12px] mb-[24px] pt-[12px] w-full">
            <app-text-input
                type="email"
                placeholder="Enter your email"
                [(ngModel)]="email"
                width="80%"
                customClass="w-full">
            </app-text-input>
        </div>

        <div class="mt-[12px] mb-[24px] pt-[12px] w-full">
            <app-text-input
                type="password"
                placeholder="Enter your password"
                [(ngModel)]="password"
                width="80%"
                customClass="w-full">
            </app-text-input>
        </div>

        <div class="w-full px-4 mb-4 text-center">
          <a routerLink="/forgot-password/email" class="text-[14px] text-gray-400 hover:text-white hover:underline">
            Forgot password?
          </a>
        </div>

        <div class="text-center pt-[24px] mb-4 w-full flex flex-col items-center">
          <app-primary-button 
            label="Continue" 
            [hasBorder]="true"
            width="240px"
            (onClick)="onContinue()">
          </app-primary-button>
        </div>

      </div>
    </div>

    <div class="flex justify-center py-8 mb-[32px]">
      <p class="text-center text-[16px] font-[500] text-gray-400">
        Don't have an account? <a routerLink="/register/name" class="text-white font-medium hover:underline">Sign up</a>  
      </p>
    </div>

  </div>

</ion-content>
