<ion-content class="bg-dark-bg text-white">

  <div class="flex flex-col justify-between min-h-full pb-20">
    
    <div class="flex-1 flex flex-col justify-center items-center">
      <div class="w-80 md:w-96 max-w-[480px] bg-neutral-800 rounded-2xl p-8 flex flex-col items-center shadow-lg">

        <div class="text-center mt-2 px-[24px]">
          <h2 class="font-sans text-[44px] font-[700] mb-2">CampusRide</h2>
        </div>

        <div class="text-center font-[16px] mt-[24px] px-[24px]">
          <p class="text-[20px] font-[600] text-gray-300 mb-4">Verify Email</p>
          <p class="text-[14px] text-gray-400">We have sent a verification code to <strong>{{ email }}</strong></p>
        </div>

        <div class="mt-[32px] mb-[24px] w-full flex justify-center">
          <app-otp-input
            [length]="6"
            [(ngModel)]="code"
            width="80%"
            inputWidth="36px"
            inputHeight="48px">
          </app-otp-input>
        </div>

        <div class="text-center pt-[24px] mb-4 w-full flex flex-col items-center gap-4">
          <app-primary-button 
            label="Verify Code" 
            [hasBorder]="true"
            width="240px"
            [disabled]="isLoading"
            (onClick)="onContinue()">
          </app-primary-button>

          <button 
            type="button"
            class="text-gray-400 hover:text-white text-[14px] underline"
            style="padding-top: 12px;"
            (click)="resendCode()">
            Resend Code
          </button>
        </div>

      </div>
    </div>

    <div class="flex justify-center py-8 mb-[32px]">
      <p class="text-center text-[16px] font-[500] text-gray-400">
        <a routerLink="/forgot-password/email" class="text-white font-medium hover:underline">← Back</a>  
      </p>
    </div>

  </div>

</ion-content>
