<ion-content class="bg-dark-bg text-white">

  <div class="flex flex-col justify-between min-h-full pb-20">
    
    <div class="flex-1 flex flex-col justify-center items-center">
      <div class="w-80 md:w-96 max-w-[480px] bg-neutral-800 rounded-2xl p-8 flex flex-col items-center shadow-lg">

        <div class="text-center mt-2 px-[24px]">
          <h2 class="font-sans text-[44px] font-[700] mb-2">CampusRide</h2>
        </div>

        <div class="text-center font-[16px] mt-[24px] px-[24px]">
          <p class="text-[20px] font-[600] text-gray-300 mb-4">New Password</p>
          <p class="text-[14px] text-gray-400">Enter your new password</p>
        </div>

        <div class="mt-[12px] mb-[12px] pt-[12px] w-full">
          <app-text-input
            type="password"
            placeholder="New Password"
            [(ngModel)]="newPassword"
            (ngModelChange)="onPasswordInput()"
            width="80%"
            customClass="w-full">
          </app-text-input>
        </div>

        <!-- Indicatori validare parolă -->
        <div *ngIf="showPasswordStrength" class="w-full px-4 mb-4">
          <div class="text-[12px] space-y-1">
            <p [class]="passwordErrors.length === 0 ? 'text-green-500' : 'text-gray-400'">
              <span *ngIf="passwordErrors.length === 0">✓</span>
              <span *ngIf="passwordErrors.length > 0">○</span>
              Strong Password
            </p>
            <ul *ngIf="passwordErrors.length > 0" class="text-red-400 pl-4 space-y-1">
              <li *ngFor="let error of passwordErrors">{{ error }}</li>
            </ul>
          </div>
        </div>

        <div class="mb-[24px] w-full">
          <app-text-input
            type="password"
            placeholder="Confirm Password"
            [(ngModel)]="confirmPassword"
            width="80%"
            customClass="w-full">
          </app-text-input>
        </div>

        <!-- Indicator if passwords match -->
        <div *ngIf="confirmPassword && confirmPassword.length > 0" class="w-full px-4 mb-4">
          <p class="text-[12px]" 
             [class.text-green-500]="passwordsMatch === true"
             [class.text-red-400]="passwordsMatch === false">
            <span *ngIf="passwordsMatch === true">✓ Passwords match</span>
            <span *ngIf="passwordsMatch === false">✗ Passwords do not match</span>
          </p>
        </div>

        <div class="text-center pt-[24px] mb-4 w-full flex flex-col items-center">
          <app-primary-button 
            label="Reset Password" 
            [hasBorder]="true"
            width="240px"
            [disabled]="isLoading || passwordErrors.length > 0 || passwordsMatch === false"
            (onClick)="onContinue()">
          </app-primary-button>
        </div>

      </div>
    </div>

    <div class="flex justify-center py-8 mb-[32px]">
      <p class="text-center text-[16px] font-[500] text-gray-400">
        <a routerLink="/login/auth" class="text-white font-medium hover:underline">← Back to Login</a>  
      </p>
    </div>

  </div>

</ion-content>
