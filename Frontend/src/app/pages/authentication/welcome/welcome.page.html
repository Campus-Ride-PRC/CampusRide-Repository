<ion-content class="bg-dark-bg text-white">

  <!-- Container principal cu flex -->
  <div class="flex flex-col justify-between min-h-full pb-20">

    <!-- Card centrat vertical -->
    <div class="flex-1 flex flex-col justify-center items-center gap-8">
      <div class="w-80 md:w-96 max-w-[480px] bg-neutral-800 rounded-2xl p-8 flex flex-col items-center shadow-lg">

        <div class="text-center mt-2">
          <h2 class="font-sans text-[44px] font-[700] mb-2">CampusRide</h2>
          <p class="text-[20px] font-[500] text-gray-300 mb-4">Your campus. Your ride. Your way.</p>
        </div>

        <img src="assets/pages/authentication/start_image.png" alt="CampusRide" class="w-full max-w-[480px] mx-auto mb-4" />

        <div class="text-center mt-2 mb-4 w-full flex flex-col items-center">
          <p class="text-[20px] font-[500] mb-3">Back on campus? Let's ride!</p>
          <app-primary-button
            label="Log in"
            [hasBorder]="true"
            width="180px"
            (onClick)="onLogin()">
          </app-primary-button>
        </div>

      </div>
