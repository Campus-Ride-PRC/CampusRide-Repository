<ion-content class="bg-dark-bg text-white">

  <!-- Container principal cu flex -->
  <div class="flex flex-col justify-between min-h-full pb-20">
    
    <!-- Card centrat vertical -->
    <div class="flex-1 flex flex-col justify-center items-center">
      <div class="w-80 md:w-96 max-w-[480px] bg-neutral-800 rounded-2xl p-8 flex flex-col items-center shadow-lg">

        <div class="text-center mt-2">
          <h2 class="font-sans text-[44px] font-[700] mb-2">CampusRide</h2>
          <p class="text-[20px] font-[500] text-gray-300 mb-4">Your campus. Your ride. Your way.</p>
        </div>

        <img src="assets/pages/authentication/success_image.png" alt="CampusRide" class="w-full max-w-[480px] mx-auto mb-4" />

        <div class="text-center mt-2 mb-4 w-full flex flex-col items-center pt-[12px]">
          <app-primary-button 
            label="Log in" 
            [hasBorder]="true"
            width="180px"
            (onClick)="onLoginPressed()">
          </app-primary-button>
        </div>

      </div>
    </div>

    <div class="flex justify-center py-8 mb-[32px]">
      <p class="text-[16px] font-[500] text-gray-400">
        Ready for your first ride?
      </p>
    </div>

  </div>

</ion-content>
