<ion-content class="bg-dark-bg text-white">

  <div class="flex flex-col justify-between min-h-full pb-20">
    
    <div class="flex-1 flex flex-col justify-center items-center">
      <div class="w-80 md:w-96 max-w-[480px] bg-neutral-800 rounded-2xl p-8 flex flex-col items-center shadow-lg">

        <div class="text-center mt-2 px-[24px]">
          <h2 class="font-sans text-[44px] font-[700] mb-2">CampusRide</h2>
        </div>

        <div class="text-center font-[16px] mt-[24px] px-[24px]">
          <p class="text-[20px] font-[600] text-gray-300">Let's find more about you. What's your name?</p>
        </div>

        <div class="mt-[6px] mb-[12px] pt-[4px] w-full">
            <app-text-input
                type="text"
                placeholder="Enter your first name"
                [(ngModel)]="firstName"
                width="80%"
                customClass="w-full">
            </app-text-input>
        </div>

        <div class="mt-[6px] mb-[24px] pt-[4px] w-full">
            <app-text-input
                type="text"
                placeholder="Enter your last name"
                [(ngModel)]="lastName"
                width="80%"
                customClass="w-full">
            </app-text-input>
        </div>

        <div class="text-center pt-[24px] mb-4 w-full flex flex-col items-center">
          <app-primary-button 
            label="Continue" 
            [hasBorder]="true"
            width="240px"
            (onClick)="onContinue()">
          </app-primary-button>
        </div>

      </div>
    </div>
  </div>

</ion-content>
