<app-header (menuClick)="onMenuOpen()"></app-header>

<ion-content class="bg-[#1a1a1a]">
  <div class="content-wrapper">
    <div class="header-section">
      <h2 class="drives-title">Drives</h2>
      <button class="add-ride-btn">
        Add Ride
      </button>
    </div>

    <div *ngIf="loading" class="loading-container">
      <ion-spinner name="crescent" class="spinner"></ion-spinner>
    </div>

    <div *ngIf="!loading && drives.length === 0" class="empty-state">
      <p class="empty-text">No drives available</p>
    </div>

    <div class="cards-container">
      <app-ride-card
        *ngFor="let drive of drives"
        [userName]="getDriverName(drive)"
        [userAvatar]="'https://api.dicebear.com/7.x/avataaars/svg?seed=' + drive.driverFirstName"
        [rating]="4.8"
        [fromLocation]="getFromLocation(drive)"
        [toLocation]="getToLocation(drive)"
        [departureTime]="formatDepartureTime(drive.time)"
        [seatsAvailable]="drive.availableSeats"
        [totalSeats]="drive.totalNoSeats"
        [price]="formatPrice(drive.price)"
        (cardClick)="onCardClick(drive)"
        class="card-item"
      ></app-ride-card>
    </div>

    <div class="see-more-container" *ngIf="!loading && drives.length > 0">
      <button class="see-more-btn">
        See more
      </button>
    </div>
  </div>
</ion-content>

<div class="fixed inset-0 z-[1000] pointer-events-none">
  <app-side-panel
    [isOpen]="isPanelOpen"
    (closed)="onPanelClosed()"
    (itemClicked)="onMenuItemClick($event)"
    class="pointer-events-auto">
  </app-side-panel>
</div>
