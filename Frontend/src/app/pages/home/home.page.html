<app-header menuTitle='CampusRide' (menuClick)="onMenuOpen()" (notificationClick)="onNotificationOpen()"></app-header>

<ion-content class="bg-[#1a1a1a]">
  <div class="content-wrapper">
    <div class="header-section">
      <h2 class="drives-title" style="font-weight: 700;">Rides</h2>
      <button class="add-ride-btn" (click)="handleAddRide()">
        Add Ride
      </button>
    </div>

    <div *ngIf="loading && drives.length === 0" class="loading-container">
      <ion-spinner name="crescent" class="spinner"></ion-spinner>
    </div>

    <div *ngIf="!loading && drives.length === 0" class="empty-state">
      <p class="empty-text">No drives available</p>
    </div>

    <div class="cards-container">
      <app-ride-card
        *ngFor="let drive of drives"
        [userName]="getDriverName(drive)"
        [userAvatar]="'https://api.dicebear.com/7.x/avataaars/svg?seed=' + drive.driverFirstName"
        [rating]="4.8"
        [fromLocation]="getFromLocation(drive)"
        [toLocation]="getToLocation(drive)"
        [departureTime]="formatDepartureTime(drive.time)"
        [seatsAvailable]="drive.availableSeats"
        [totalSeats]="drive.totalNoSeats"
        [price]="formatPrice(drive.price)"
        (cardClick)="onCardClick(drive)"
        class="card-item"
      ></app-ride-card>
    </div>

    <!-- Infinite Scroll -->
    <ion-infinite-scroll
      threshold="100px"
      (ionInfinite)="loadMoreDrives($event)"
      [disabled]="isLastPage">
      <ion-infinite-scroll-content
        loadingSpinner="crescent"
        loadingText="Loading more drives...">
      </ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </div>
</ion-content>

<div class="fixed inset-0 z-[1000] pointer-events-none">
  <app-side-panel
    [isOpen]="isPanelOpen"
    [userFirstName]="user?.firstName || 'Guest'"
    [userAvatar]="user ? 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + user.firstName : ''"
    (closed)="onPanelClosed()"
    (itemClicked)="onMenuItemClick($event)"
    (rideClicked)="onRideClick($event)"
    class="pointer-events-auto">
  </app-side-panel>
</div>
