<ion-content class="payment-result-content">
    <div class="content-wrapper">
        <!-- Loading State -->
        <div *ngIf="isLoading()" class="status-container loading">
            <ion-spinner name="crescent" class="spinner"></ion-spinner>
            <h2>Verifying Payment</h2>
            <p>Please wait while we confirm your payment...</p>
        </div>

        <!-- Success State -->
        <div *ngIf="!isLoading() && isSuccess()" class="status-container success">
            <div class="icon-circle success-circle">
                <ion-icon name="checkmark-circle-outline"></ion-icon>
            </div>
            <h2>Payment Successful!</h2>
            <p>Your booking request has been submitted successfully. The driver will review and confirm your ride.</p>
            
            <div class="action-buttons">
                <button class="action-btn primary" (click)="goToMyBookings()">
                    View My Bookings
                </button>
                <button class="action-btn secondary" (click)="goToHome()">
                    <ion-icon name="home-outline"></ion-icon>
                    Back to Home
                </button>
            </div>
        </div>

        <!-- Error State -->
        <div *ngIf="!isLoading() && !isSuccess()" class="status-container error">
            <div class="icon-circle error-circle">
                <ion-icon name="close-circle-outline"></ion-icon>
            </div>
            <h2>Payment Issue</h2>
            <p>{{ errorMessage() || 'Something went wrong with your payment.' }}</p>
            
            <div class="action-buttons">
                <button class="action-btn primary" (click)="goToRideDetails()">
                    Try Again
                </button>
                <button class="action-btn secondary" (click)="goToHome()">
                    <ion-icon name="home-outline"></ion-icon>
                    Back to Home
                </button>
            </div>
        </div>
    </div>
</ion-content>
