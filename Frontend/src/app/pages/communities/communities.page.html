<app-header 
  menuTitle="Communities" 
  (menuClick)="togglePanel()"
  (notificationClick)="goToNotifications()"
></app-header>

<ion-content>
  <div class="communities-container">
    <div style="padding-inline: 20px;">
      <h2 style="font-style: bold;">Your Communities</h2>
      
      <div *ngIf="userCommunities.length === 0" class="empty-message">
        <p>You didn't join any communities yet, join one now or create a new one!</p>
      </div>
      
      <div *ngIf="userCommunities.length > 0" class="communities-list">
        <!-- Communities will be displayed here -->
        <div *ngFor="let community of userCommunities">
          {{ community.name }}
        </div>
      </div>

      <button class="add-community-btn" (click)="onAddCommunity()">
        Add New Community
      </button>

      <h2 style="margin-top: 32px;">Discover Communities</h2>
      
      <div *ngIf="newCommunities.length === 0" class="empty-message">
        <p>No new communities available at the moment.</p>
      </div>
      
      <div *ngIf="newCommunities.length > 0" class="communities-list">
        <!-- New communities will be displayed here -->
        <div *ngFor="let community of newCommunities">
          {{ community.name }}
        </div>
      </div>
    </div>
  </div>
</ion-content>

<!-- Add Community Modal -->
<div class="modal-overlay" *ngIf="showAddModal" (click)="closeAddModal()"></div>
<div class="bottom-modal" [class.show]="showAddModal">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Create New Community</h2>
      <button class="close-btn" (click)="closeAddModal()">×</button>
    </div>
    
    <div class="modal-body">
      <div class="form-group">
        <label for="communityName">Community Name</label>
        <input 
          id="communityName"
          type="text" 
          [(ngModel)]="newCommunityName"
          placeholder="Enter community name"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label for="communityDescription">Description</label>
        <textarea 
          id="communityDescription"
          [(ngModel)]="newCommunityDescription"
          placeholder="Enter community description"
          class="form-textarea"
          rows="4"
        ></textarea>
      </div>

      <button class="create-btn" (click)="createCommunity()">
        Create Community
      </button>
    </div>
  </div>
</div>

<!-- Success Animation Overlay -->
<div class="success-overlay" *ngIf="showSuccessAnimation">
  <div class="success-animation">
    <div class="checkmark-circle">
      <svg class="checkmark" viewBox="0 0 52 52">
        <circle class="checkmark-circle-path" cx="26" cy="26" r="25" fill="none"/>
        <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
      </svg>
    </div>
    <p class="success-text">Community Created!</p>
  </div>
</div>

<div class="fixed inset-0 z-[1000] pointer-events-none">
  <app-side-panel 
    [isOpen]="isPanelOpen()" 
    [userFirstName]="user?.firstName || 'Guest'"
    [userAvatar]="user ? 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + user.firstName : ''"
    [friendsCount]="friendsCount"
    [ridesCount]="ridesCount"
    [currentRoute]="'/communities'"
    (closed)="closePanel()"
    (itemClicked)="onMenuItemClick($event)"
    class="pointer-events-auto">
  </app-side-panel>
</div>
